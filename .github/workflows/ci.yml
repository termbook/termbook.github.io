name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run build
      - run: node scripts/check-links.mjs
      - name: Keep the built site for review
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 7
